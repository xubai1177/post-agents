name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.0.4)
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use an existing version tag (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Record tagged commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Version tag must match the package version." >&2
            exit 1
          fi
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$IS_DRAFT" != true ]]; then
              echo "$TAG is already published." >&2
              exit 1
            fi
          else
            if [[ -f "release-notes/$TAG.md" ]]; then
              gh release create "$TAG" --draft --title "灵稿 AI $TAG" --notes-file "release-notes/$TAG.md" --verify-tag
            else
              gh release create "$TAG" --draft --title "灵稿 AI $TAG" --generate-notes --verify-tag
            fi
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: windows-x64
          - os: macos-latest
            target: --mac --arm64
            artifact: macos-arm64
          - os: macos-15-intel
            target: --mac --x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create installers
        run: npx --yes electron-builder@26.0.12 ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          shopt -s nullglob
          assets=(dist/*.exe dist/*.dmg dist/*.zip)
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -s dist/latest.yml
            node scripts/verify-update.cjs dist "${TAG#v}"
            assets+=(dist/latest.yml)
          fi
          if (( ${#assets[@]} == 0 )); then
            echo "No installers were produced." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          VERSION=${TAG#v}
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')
          for installer in mac-arm64.dmg mac-arm64.zip mac-x64.dmg mac-x64.zip win-x64.exe; do
            if ! grep -Fxq "linggao-ai-$VERSION-$installer" <<< "$ASSETS"; then
              echo "Missing installer: $installer" >&2
              exit 1
            fi
          done
          grep -Fxq latest.yml <<< "$ASSETS" || { echo "Missing latest.yml" >&2; exit 1; }
          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" --dir "$VERIFY_DIR" --pattern latest.yml --pattern "linggao-ai-$VERSION-win-x64.exe"
          node scripts/verify-update.cjs "$VERIFY_DIR" "$VERSION"
          gh release edit "$TAG" --draft=false --verify-tag

  publish-update-server:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPDATE_SSH_KEY: ${{ secrets.LINGGAO_UPDATE_SSH_KEY }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          STAGE=$(mktemp -d)
          SSH_DIR=$(mktemp -d)
          trap 'rm -rf "$STAGE" "$SSH_DIR"' EXIT
          printf '%s\n' "$UPDATE_SSH_KEY" > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"
          printf '%s\n' '39.106.162.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH0QWGVHkUol547yBo1BOQmfWKINjG3yLWxXWy7OXRY1' > "$SSH_DIR/known_hosts"
          gh release download "$TAG" --dir "$STAGE" --pattern latest.yml --pattern "linggao-ai-$VERSION-win-x64.exe" --pattern "linggao-ai-$VERSION-mac-arm64.dmg" --pattern "linggao-ai-$VERSION-mac-x64.dmg"
          node scripts/verify-update.cjs "$STAGE" "$VERSION"
          RELEASE_NOTES=$(gh release view "$TAG" --json body --jq .body)
          export VERSION RELEASE_NOTES STAGE
          node -e 'require("node:fs").writeFileSync(process.env.STAGE + "/latest.json", JSON.stringify({version: process.env.VERSION, notes: process.env.RELEASE_NOTES}))'
          tar -C "$STAGE" -cf - latest.json latest.yml "linggao-ai-$VERSION-win-x64.exe" "linggao-ai-$VERSION-mac-arm64.dmg" "linggao-ai-$VERSION-mac-x64.dmg" | ssh -T -i "$SSH_DIR/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" linggao-update@39.106.162.75
