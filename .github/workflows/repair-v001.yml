name: Repair v0.0.1 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v001.yml'
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the initial tag to the repaired code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3b563953d86a76cc5fde7c12ef3c2d8a7d41191c"
          test "$(node -p "require('./package.json').version")" = "0.0.1"
          git tag -f v0.0.1 "$GITHUB_SHA"
          git push --force-with-lease=refs/tags/v0.0.1:01778c505f6309f42ed058a126996033ac30ffce origin refs/tags/v0.0.1
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref v0.0.1
