/* ═══════════════════════════════════════════════════════════════
   设计精修层 Design Polish Layer（整段删除即可完整回退）
   仅覆盖视觉：中性色板 / 排版层级 / 组件状态 / 可访问性
   —— 强调色 --accent* 仍由 applyTheme 按四套配色动态计算，保持不变
   ═══════════════════════════════════════════════════════════════ */

/* ① Tokens：冷灰蓝中性色，与强调色更协调、对比度达 WCAG AA */
html[data-theme="light"]{--canvas:#f6f7fb;--surface:#fff;--sidebar:#f8f9fc;--line:#e5e8f0;--ink:#1f2430;--muted:#6b7280;--hover:#eef1f7;--inset:#f4f6fa;--shadow-card:0 1px 2px rgba(24,32,56,.05),0 8px 24px rgba(24,32,56,.06);--shadow-hover:0 4px 12px rgba(24,32,56,.08),0 16px 40px rgba(24,32,56,.08);--shadow-pop:0 12px 40px rgba(20,28,48,.18)}

/* ② 字体与排版层级 */
html[data-theme] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
html[data-theme] .eyebrow{letter-spacing:.16em;font-weight:800}

html[data-theme] .card-head p,html[data-theme] .settings-label small{line-height:1.55}

/* ③ 顶栏选中态：底部指示条 */
html[data-theme] .topnav{gap:6px}

/* ④ 侧栏：品牌投影 + 目录选中指示条 */

/* ⑤ 卡片与弹层层次 */
html[data-theme] .card,html[data-theme] .settings-box{box-shadow:var(--shadow-card);border-radius:13px;transition:box-shadow .18s ease}

html[data-theme] .dialog{box-shadow:var(--shadow-pop)!important}

/* ⑥ 按钮微交互 */

/* ⑦ 表单与编辑区 */

/* ⑨ 焦点可见、滚动条与减少动态（可访问性） */
html[data-theme] :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

html[data-theme] *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* 创作工作台，与桌面应用共享品牌色、明暗模式和内容优先的布局。 */
html[data-theme] {
  --brand: #146c62; --canvas: #f6f7f8; --surface: #fff; --sidebar: #f6f7f8;
  --inset: #eef1f2; --hover: var(--inset); --ink: #24292e; --muted: #535e66;
  --line: #dce1e4; --control-line: #8b979e;
  --accent: oklch(from var(--brand) 0.47 c h); --accent-hover: oklch(from var(--brand) 0.42 c h);
  --accent-text: var(--accent); --accent-on: #fff;
  --accent-soft: color-mix(in srgb, var(--brand) 8%, var(--surface));
  --accent-border: color-mix(in srgb, var(--brand) 40%, var(--line));
  --warm-soft: #fff3df; --warm-text: #744515;
  --positive: #1f684d; --positive-soft: #e5f6ee; --danger: #9b263b; --danger-soft: #ffedf0;
  background: var(--canvas); color: var(--ink);
}
html[data-theme="dark"] {
  --canvas: #171a1c; --surface: #202426; --sidebar: #171a1c; --inset: #2a2f32;
  --ink: #edf1f2; --muted: #bac4c9; --line: #394247; --control-line: #69777d;
  --accent: oklch(from var(--brand) 0.8 c h); --accent-hover: oklch(from var(--brand) 0.86 c h);
  --accent-on: #121b1b;
  --warm-soft: #392e20; --warm-text: #e9bc78; --positive: #8de0b7;
  --positive-soft: #1e382e; --danger: #ffacbc; --danger-soft: #442331;
}

function treeArticle(d, folderId, matches=false){return `<div class="proto-draft proto-topic" ${matches?'':'draggable="true" data-tree-drag'}><details class="proto-folder" ${matches?'':`data-tree-node="article:${esc(d.id)}"`} ${matches||treeExpansion().has('article:'+d.id)?'open':''}><summary data-article-menu="${esc(d.id)}" ${matches?'':`data-sort-node="article:${esc(d.id)}" data-tree-parent="${esc(folderId??'')}"`} title="${esc(d.title)}"><svg class="proto-folder-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h7l2 2h9v11H3z"/></svg><span>${esc(d.title)}</span></summary><div class="proto-children">${d.platforms.map(p=>`<button type="button" data-page="detail" data-id="${esc(d.id)}" data-target-platform="${esc(p)}" class="${page==='detail'&&selected===d.id&&platform===p?'active':''}"><span class="proto-platform-logo" aria-hidden="true">${platformTreeLogos[p]}</span><span data-tree-platform-title>${esc(d.platformTitles?.[p]??d.title)}</span></button>`).join('')}</div></details><button type="button" class="tree-more" data-more-article="${esc(d.id)}" aria-label="${esc(d.title)}的操作" aria-expanded="${articleMenu?.id===d.id}">⋯</button></div>`}
function folderNameEditor(){return `<div class="proto-name-editor"><form class="proto-name-row" id="folder-form"><svg class="proto-folder-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg><input id="folder-name" name="name" maxlength="100" aria-label="${folderEditor.type==='create'?'新建文件夹名称':'重命名文件夹'}" placeholder="未命名" value="${esc(folderEditor.name||'')}"></form></div>`}
function treeFolder(f){return folderEditor?.type==='rename'&&folderEditor.id===f.id?folderNameEditor():`<div class="proto-folder-row"><details class="proto-folder" data-tree-node="folder:${esc(f.id)}" data-drop-folder="${esc(f.id)}" ${treeExpansion().has('folder:'+f.id)?'open':''}><summary data-folder-menu="${esc(f.id)}" data-sort-node="folder:${esc(f.id)}" data-tree-parent="${esc(f.parentId??'')}" draggable="true" data-tree-drag title="右键操作"><svg class="proto-folder-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>${esc(f.name)}</summary><div class="proto-children">${folderEditor?.type==='create'&&folderEditor.parentId===f.id?folderNameEditor():''}${renderTreeChildren(f.id)}</div></details><button type="button" class="tree-more" data-more-folder="${esc(f.id)}" aria-label="${esc(f.name)}的操作" aria-expanded="${folderMenu?.id===f.id}">⋯</button></div>`}
function renderTreeChildren(parentId){
  return orderedTreeChildren(parentId).map(([,node])=>node.kind==='folder'?treeFolder(node.item):treeArticle(node.item,parentId)).join('');
}
function treeContents(){
  const query=articleQuery.trim().toLocaleLowerCase();
  if(!query)return renderTreeChildren(null);
  const matches=state.drafts.filter(d=>d.title.toLocaleLowerCase().includes(query));
  return matches.length?matches.map(d=>treeArticle(d,null,true)).join(''):'<p class="tree-empty" role="status">未找到匹配的文章。</p>';
}
function workspaceTree(){ensureTree();return `<div class="proto-tree"><label class="workspace-search"><span aria-hidden="true">⌕</span><input type="search" id="workspace-search" aria-label="搜索文章标题" placeholder="搜索文章" value="${esc(articleQuery)}"></label>${folderEditor?.type==='create'&&folderEditor.parentId===null?folderNameEditor():''}${folderRemoving?`<div class="proto-inline" role="group" aria-label="确认删除目录"><p>删除“${esc(folderRemoving.name)}”及其子目录？其中文章会移至根目录。</p><div><button type="button" data-action="folder-confirm-delete">确认删除</button><button type="button" data-action="folder-cancel">取消</button></div></div>`:''}${articleRemoving?`<div class="proto-inline" role="group" aria-label="确认删除文章"><p>永久删除“${esc(articleRemoving.title)}”？该文章所有平台的正文、配图、来源及未保存修改都会删除，无法恢复。</p><div><button type="button" class="proto-delete-action" data-action="article-confirm-delete">确认删除</button><button type="button" data-action="article-cancel-delete">取消</button></div></div>`:''}<div class="proto-root" data-drop-folder=""><div id="workspace-tree-content">${treeContents()}</div><div class="proto-root-drop" aria-hidden="true"></div></div></div>`}

function topicBatchDetail(batch,queue){return `<section class="topic-detail-page"><div class="topic-detail-nav"><button type="button" class="records-back" data-action="back-topic-records">← 返回选题记录</button></div><div class="topic-detail-heading"><div><h2>${esc(batch.direction||'选题记录')}</h2><p>${esc(batch.audience||'未指定受众')} · ${batch.candidates.length} 个选题 · ${esc(new Date(batch.createdAt).toLocaleString('zh-CN'))}</p></div></div><div class="card topic-detail-card"><div class="batch-body"><div class="batch-heading"><div class="child-table-heading"><strong class="child-table-title">选题明细</strong><span class="subtle">已选 ${batch.selected.length} 项</span></div><button type="button" class="primary" data-action="enqueue" data-batch="${esc(batch.id)}" ${batch.selected.length?'':'disabled'}>批量创建文章</button></div><div class="topic-table-scroll"><table class="topic-table" aria-label="${esc(batch.direction||'选题记录')}的选题明细"><thead><tr><th scope="col"><input type="checkbox" data-select-batch="${esc(batch.id)}" aria-label="全选本组选题" ${batch.selected.length===batch.candidates.length&&batch.candidates.length?'checked':''}></th><th scope="col">选题</th><th scope="col">创作角度</th><th scope="col">状态</th></tr></thead><tbody>${batch.candidates.map((c,i)=>{const task=queue.find(q=>q.batchId===batch.id&&q.index===i);return `<tr><td><input type="checkbox" data-topic-check="${i}" data-batch="${esc(batch.id)}" aria-label="选择 ${esc(c.title)}" ${batch.selected.includes(i)?'checked':''}></td><td><strong>${esc(c.title)}</strong></td><td>${esc(c.angle)}</td><td>${task?`<span class="tag">${task.status==='done'?'已完成':'创作中'}</span>`:'<span class="topic-table-muted">未加入</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="child-table-footer"><span>待核事项：适用范围、最新信息和来源。</span><details class="topic-sources"><summary>查看来源</summary><p>示例公开资料（未实际联网），请自行核查。</p></details></div></div></div></section>`}
function topics(){

ipped?'本次跳过联网核查，请自行查证。':'示例检索记录，未实际联网，请自行核查来源。'}</p>${d.research?.skipped?'':'<div class="source">示例公开资料 <span>示意来源</span></div><p><b>待核事项：</b>适用条件、时效及数据准确性。</p>'}</section></aside></div>`}

2><div class="settings-box"><div class="settings-row"><div class="settings-label"><strong>服务配置</strong><small>选择复用模型服务，或使用单独的图片服务。</small></div><label class="field"><select name="imageService" aria-label="图片服务配置"><option value="shared" ${s.imageService==='shared'?'selected':''}>复用模型服务地址与密钥</option><option value="custom" ${s.imageService==='custom'?'selected':''}>使用单独的图片服务</option></select></label></div><div id="custom-settings" ${s.imageService==='custom'?'':'hidden'}><div class="settings-row"><div class="settings-label"><strong>图片 API 地址</strong></div><label class="field"><input name="imageApiUrl" aria-label="图片 API 地址" value="${esc(s.imageApiUrl)}" placeholder="https://api.example.com/v1"></label></div><div class="settings-row"><div class="settings-label"><strong>图片 API 密钥</strong><small>演示环境，请勿输入真实密钥；密钥不会保存。</small></div><label class="field"><input name="imageKey" aria-label="图片 API 密钥" type="password" autocomplete="off" placeholder="仅演示，不会保存"></label></div></div><div class="settings-row"><div class="settings-label"><strong>图片模型名称</strong><small>请确认服务支持图片生成接口。</small></div><div><label class="field"><input name="imageModel" list="prototype-image-models" aria-label="图片模型名称" value="${esc(s.imageModel)}" placeholder="选择或输入图片模型名称"><datalist id="prototype-image-models"></datalist></label><button type="button" class="secondary" data-action="list-image-models">获取图片模型列表</button><small id="prototype-image-model-feedback" role="status"></small></div></div></div></section><div class="settings-savebar"><small class="muted">非密钥设置保存在浏览器本地</small><button class="primary">保存设置</button></div></form></div></div>`}
function applyTheme(){
  const {mode,color}=catalog.appearance;
  document.documentElement.dataset.theme='light';
  document.documentElement.dataset.palette=presetForColor(color)?.id||'custom';
  document.documentElement.style.setProperty('--brand',/^#[0-9a-f]{6}$/i.test(color)?color:'#5268d9');
  document.documentElement.style.setProperty('--panel-opacity',`${Number.isInteger(catalog.appearance.opacity)?catalog.appearance.opacity:88}%`);
}

function render(){history.replaceState(null,'',routeHash(page,selected,selected?platform:''));renderVersion++;applyTheme();layout(page==='topics'?topics():page==='create'?create():page==='settings'?settings():page==='platforms'?platformPage():prototypeFolderId?prototypeFolderContents():detail());if(page==='settings')renderUpdateSettings()}
let updatePlatform='windows',updateState='available',updatePercent=0,updateTimer;
const updateDialog=document.getElementById('update-dialog');
function showUpdate(){
  const progress=document.getElementById('update-progress'),primary=document.getElementById('update-primary');
  progress.hidden=updateState!=='downloading';
  progress.querySelector('span').textContent=`正在下载更新 ${updatePercent}%`;
  progress.querySelector('progress').value=updatePercent;
  primary.disabled=updateState==='downloading';
  primary.textContent=updatePlatform==='mac'?'下载 Mac 安装包':updateState==='downloaded'?'重启更新':'下载更新';
  if(!updateDialog.open)updateDialog.showModal();
}
document.getElementById('update-later').onclick=()=>updateDialog.close();
document.getElementById('update-primary').onclick=()=>{
  if(updatePlatform==='mac'){updateDialog.close();toast('示例交互：下载安装包');return}
  if(updateState==='downloaded'){updateDialog.close();toast('示例交互：重启并安装更新');return}
  updateState='downloading';updatePercent=0;showUpdate();
  updateTimer=setInterval(()=>{updatePercent=Math.min(100,updatePercent+10);if(updatePercent===100){clearInterval(updateTimer);updateState='downloaded';if(!updateDialog.open)toast('更新已下载，可在设置中重启更新。')}if(updateDialog.open)showUpdate()},180);
};
function renderUpdateSettings(){
  const nav=document.querySelector('.settings-nav'),main=document.querySelector('.settings-main');
  if(!nav||!main)return;
  nav.insertAdjacentHTML('beforeend','<a href="#settings-update">软件更新</a>');
  main.insertAdjacentHTML('beforeend',`<section id="settings-update" class="settings-group"><h2>软件更新</h2><div class="settings-box"><div class="settings-row"><div class="settings-label"><strong>当前版本</strong><small>v0.0.4</small></div><button type="button" class="secondary" id="update-check">检查更新</button></div><div class="settings-row"><div class="settings-label"><strong>体验平台</strong></div><select id="update-platform" aria-label="体验更新平台"><option value="windows" ${updatePlatform==='windows'?'selected':''}>Windows</option><option value="mac" ${updatePlatform==='mac'?'selected':''}>Mac</option></select></div></div></section>`);
  document.getElementById('update-check').onclick=()=>{if(updateState==='downloaded'||updateState==='downloading'){showUpdate();return}const button=document.getElementById('update-check');button.disabled=true;button.textContent='正在检查…';setTimeout(()=>{button.disabled=false;button.textContent='检查更新';showUpdate()},600)};
  document.getElementById('update-platform').onchange=event=>{updatePlatform=event.target.value;clearInterval(updateTimer);updateState='available';updatePercent=0};
}
setTimeout(()=>{if(!updateDialog.open)showUpdate()},1800);

app.addEventListener('click',e=>{

  const details=summary.parentElement;
