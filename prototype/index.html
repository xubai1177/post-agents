/* ═══════════════════════════════════════════════════════════════
   设计精修层 Design Polish Layer（整段删除即可完整回退）
   仅覆盖视觉：中性色板 / 排版层级 / 组件状态 / 可访问性
   —— 强调色 --accent* 仍由 applyTheme 按四套配色动态计算，保持不变
   ═══════════════════════════════════════════════════════════════ */

/* ① Tokens：冷灰蓝中性色，与强调色更协调、对比度达 WCAG AA */
html[data-theme="light"]{--canvas:#f6f7fb;--surface:#fff;--sidebar:#f8f9fc;--line:#e5e8f0;--ink:#1f2430;--muted:#6b7280;--hover:#eef1f7;--inset:#f4f6fa;--shadow-card:0 1px 2px rgba(24,32,56,.05),0 8px 24px rgba(24,32,56,.06);--shadow-hover:0 4px 12px rgba(24,32,56,.08),0 16px 40px rgba(24,32,56,.08);--shadow-pop:0 12px 40px rgba(20,28,48,.18)}

/* ② 字体与排版层级 */
html[data-theme] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
html[data-theme] .eyebrow{letter-spacing:.16em;font-weight:800}

html[data-theme] .card-head p,html[data-theme] .settings-label small{line-height:1.55}

/* ③ 顶栏选中态：底部指示条 */
html[data-theme] .topnav{gap:6px}

/* ④ 侧栏：品牌投影 + 目录选中指示条 */

/* ⑤ 卡片与弹层层次 */
html[data-theme] .card,html[data-theme] .settings-box{box-shadow:var(--shadow-card);border-radius:13px;transition:box-shadow .18s ease}

html[data-theme] .dialog{box-shadow:var(--shadow-pop)!important}

/* ⑥ 按钮微交互 */

/* ⑦ 表单与编辑区 */

/* ⑨ 焦点可见、滚动条与减少动态（可访问性） */
html[data-theme] :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

html[data-theme] *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* 创作工作台，与桌面应用共享品牌色、明暗模式和内容优先的布局。 */
html[data-theme] {
  --brand: #146c62; --canvas: #f6f7f8; --surface: #fff; --sidebar: #f6f7f8;
  --inset: #eef1f2; --hover: var(--inset); --ink: #24292e; --muted: #535e66;
  --line: #dce1e4; --control-line: #8b979e;
  --accent: oklch(from var(--brand) 0.47 c h); --accent-hover: oklch(from var(--brand) 0.42 c h);
  --accent-text: var(--accent); --accent-on: #fff;
  --accent-soft: color-mix(in srgb, var(--brand) 8%, var(--surface));
  --accent-border: color-mix(in srgb, var(--brand) 40%, var(--line));
  --warm-soft: #fff3df; --warm-text: #744515;
  --positive: #1f684d; --positive-soft: #e5f6ee; --danger: #9b263b; --danger-soft: #ffedf0;
  background: var(--canvas); color: var(--ink);
}
html[data-theme="dark"] {
  --canvas: #171a1c; --surface: #202426; --sidebar: #171a1c; --inset: #2a2f32;
  --ink: #edf1f2; --muted: #bac4c9; --line: #394247; --control-line: #69777d;
  --accent: oklch(from var(--brand) 0.8 c h); --accent-hover: oklch(from var(--brand) 0.86 c h);
  --accent-on: #121b1b;
  --warm-soft: #392e20; --warm-text: #e9bc78; --positive: #8de0b7;
  --positive-soft: #1e382e; --danger: #ffacbc; --danger-soft: #442331;
}

function prototypeDeletePlan(nodes){const folders=new Set([...nodes].filter(n=>n.startsWith('folder:')).map(n=>n.slice(7)));let count;do{count=folders.size;state.folders.forEach(f=>{if(folders.has(f.parentId))folders.add(f.id)})}while(count!==folders.size);const articles=new Set([...nodes].filter(n=>n.startsWith('article:')).map(n=>n.slice(8)));state.drafts.forEach(d=>{let parent=state.assignments[d.id],seen=new Set();while(parent&&!seen.has(parent)){if(folders.has(parent)){articles.add(d.id);break}seen.add(parent);parent=state.assignments[parent]}});return {folders,articles}}
function prototypeDelete(plan){if([...plan.articles].some(id=>{const d=state.drafts.find(x=>x.id===id);return d?.generation&&['queued','running'].includes(d.generation.status)})){toast('所选内容中有文章正在生成，请完成后重试。');return false}if(plan.articles.has(selected)&&editing!==saved){toast('所选内容中有未保存的修改，请先保存后再删除。');return false}state.folders=state.folders.filter(f=>!plan.folders.has(f.id));state.drafts=state.drafts.filter(d=>!plan.articles.has(d.id));Object.keys(state.assignments).forEach(id=>{if(plan.articles.has(id))delete state.assignments[id]});state.queue.forEach(task=>{if(plan.articles.has(task.draftId)){delete task.draftId;task.articleDeleted=true}});if(plan.articles.has(selected)){selected=state.drafts[0]?.id||'';platform='小红书';loadDoc()}if(plan.folders.has(prototypeFolderId))prototypeFolderId=null;removeTreeOrder(new Set([...plan.folders].map(id=>'folder:'+id).concat([...plan.articles].map(id=>'article:'+id))));setTreeNodesOpen([...plan.folders].map(id=>'folder:'+id),false);treeSelection.clear();persist();render();toast('所选内容已删除。');return true}

function prototypeTaskPanel(){
  const labels={queued:'排队中',running:'进行中',creating:'进行中',done:'已完成',failed:'失败',interrupted:'已中断',waiting:'等待处理'};
  const articles=[...state.drafts.filter(d=>d.generation).map(d=>({title:d.title,status:d.generation.status,detail:d.generation.imageProgress,draftId:d.id,retryDraft:true})),...state.queue.filter(q=>q.kind!=='topic').map(q=>({title:q.title,status:q.status,detail:q.folderWarning,draftId:q.draftId}))];
  const topics=state.queue.filter(q=>q.kind==='topic').map(q=>({title:q.title,status:q.status,topicId:q.id}));
  const images=prototypeImageJobs.map(j=>({title:`${j.draft.title} · ${j.platform}`,status:j.status}));
  const groups=[['文章生成',articles],['选题生成',topics],['配图生成',images]],group=groups[taskCategory];
  const rows=group[1].filter(row=>taskFilter==='all'||(taskFilter==='active'&&['queued','running','creating'].includes(row.status))||(taskFilter==='attention'&&['failed','waiting','interrupted'].includes(row.status))||(taskFilter==='done'&&row.status==='done'));

function topicBatchDetail(batch,queue){return `<section class="proto-topic-candidates"><div class="proto-topic-batch-heading"><div><input type="checkbox" data-select-batch="${esc(batch.id)}" aria-label="全选本组选题" ${batch.selected.length===batch.candidates.length&&batch.candidates.length?'checked':''}><strong>选题明细</strong><span>已选 ${batch.selected.length} 项</span></div><button type="button" class="primary" data-action="enqueue" data-batch="${esc(batch.id)}" ${batch.selected.length?'':'disabled'}>批量创建文章</button></div><table class="proto-topic-candidate-table" aria-label="选题明细"><colgroup><col class="proto-select-col"><col><col class="proto-status-col"><col class="proto-action-col"></colgroup><thead><tr><th scope="col"><span class="proto-sr-only">选择</span></th><th scope="col">选题</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody>${batch.candidates.map((c,i)=>{const task=queue.find(q=>q.batchId===batch.id&&q.index===i);const status=task?.status||'idle';return `<tr><td><input type="checkbox" data-topic-check="${i}" data-batch="${esc(batch.id)}" aria-label="选择 ${esc(c.title)}" ${batch.selected.includes(i)?'checked':''}></td><td><div><div class="proto-topic-candidate-title"><strong>${esc(c.title)}</strong></div><p>${esc(c.angle||'')}</p><details><summary>查看详情</summary><p>${esc(c.reason||'请核查事实与来源。')}</p><p>待核事项：${esc(c.pending?.join('；')||'请核查事实与来源。')}</p></details></div></td><td><span class="proto-topic-candidate-status" data-status="${esc(status)}">${task?(status==='done'?'已完成':status==='failed'?'失败':status==='interrupted'?'已中断':'创作中'):'未加入'}</span></td><td><button type="button" class="proto-topic-generate" data-action="choose-topic" data-batch="${esc(batch.id)}" data-index="${i}" aria-label="生成文章：${esc(c.title)}">生成</button></td></tr>`}).join('')}</tbody></table><div class="proto-topic-footer"><span>待核事项：适用范围、最新信息和来源。</span><details><summary>查看来源</summary><p>示例来源（未实际联网），文案需要人工核查。</p></details></div></section>`}
function topics(){
 const topicRuns=state.queue.filter(q=>q.kind==='topic'),queue=state.queue.filter(q=>q.kind!=='topic'),linked=new Set(topicRuns.map(q=>q.batchId).filter(Boolean)),legacy=state.batches.filter(b=>!linked.has(b.id)),recordCount=topicRuns.length+legacy.length;
 const currentRun=selectedTopicRun?topicRuns.find(q=>q.id===selectedTopicRun):!selectedTopicBatch?topicRuns[0]:null, batch=state.batches.find(b=>b.id===(selectedTopicBatch||currentRun?.batchId||(!currentRun?legacy[0]?.id:null)));
 const selectedKey=currentRun?'run:'+currentRun.id:batch?'record:'+batch.id:'';
 const labels={queued:'排队中',creating:'生成中…',done:'已完成',failed:'失败',interrupted:'已中断'};
 return `<div class="topics-wrap topic-page-compact"><div class="topic-view-toolbar"><div class="proto-topic-heading"><h1>选题记录</h1><span>${recordCount}</span></div><button type="button" class="primary topic-create-button" data-action="open-topic-drawer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>生成选题</button></div><div class="proto-topic-split"><aside class="proto-topic-records" aria-label="选题记录">${topicRuns.map(q=>`<button type="button" class="proto-topic-record" data-action="select-topic-record" data-kind="run" data-id="${esc(q.id)}" aria-pressed="${selectedKey==='run:'+q.id}"><strong>${esc(q.direction)}</strong><span class="proto-topic-meta"><span>${esc(new Date(q.createdAt||Date.now()).toLocaleDateString('zh-CN'))}</span><span>${q.count||5} 个选题</span></span><span class="topic-status-pill" data-status="${esc(q.status)}">${labels[q.status]||q.status}</span></button>`).join('')}${legacy.map(b=>`<button type="button" class="proto-topic-record" data-action="select-topic-record" data-kind="record" data-id="${esc(b.id)}" aria-pressed="${selectedKey==='record:'+b.id}"><strong>${esc(b.direction||'选题记录')}</strong><span class="proto-topic-meta"><span>${esc(new Date(b.createdAt).toLocaleDateString('zh-CN'))}</span><span>${b.candidates.length} 个选题</span></span><span class="topic-status-pill" data-status="done">已完成</span></button>`).join('')}${!recordCount?'<p class="proto-topic-list-empty">暂无选题记录</p>':''}</aside><section class="proto-topic-content" aria-label="选题详情">${batch?topicBatchDetail(batch,queue):currentRun?`<div class="proto-topic-placeholder"><strong>${esc(currentRun.direction)}</strong><p>${labels[currentRun.status]||currentRun.status}</p>${['failed','interrupted'].includes(currentRun.status)?`<button type="button" class="secondary" data-action="retry-topic-task" data-id="${esc(currentRun.id)}">重试</button>`:''}</div>`:'<div class="proto-topic-placeholder">选择一条选题记录查看详情。</div>'}</section></div></div>`
