appId: com.linggao.desktop
productName: 灵稿 AI
artifactName: linggao-ai-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - src/renderer/public/icon.png
  - package.json
  - '!**/.env*'
asar: true
mac:
  icon: src/renderer/public/icon.png
  publish:
    provider: generic
    url: https://update.dknx.top/linggao-ai/
  target:
    - dmg
    - zip
win:
  publish:
    provider: github
    owner: xubai1177
    repo: post-agents
  icon: src/renderer/public/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
