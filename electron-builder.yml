appId: com.linggao.desktop
productName: 灵稿 AI
artifactName: linggao-ai-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - src/renderer/public/icon.png
  - package.json
  - '!**/.env*'
asar: true
beforePack: scripts/verify-ffmpeg-arch.cjs
mac:
  extraResources:
    - from: licenses/whiteboard
      to: licenses/whiteboard
    - from: scripts/whiteboard-svg-render.html
      to: whiteboard-svg-render.html
    - from: scripts/whiteboard-rough.js
      to: whiteboard-rough.js
    - from: scripts/whiteboard-font.ttf
      to: whiteboard-font.ttf
    - from: .cache/ffmpeg/ffmpeg
      to: ffmpeg
    - from: .cache/ffmpeg/source.tar.xz
      to: licenses/whiteboard/ffmpeg-source.tar.xz
    - from: .cache/ffmpeg/COPYING.LGPLv2.1
      to: licenses/whiteboard/FFMPEG-LGPL.txt
    - from: .cache/ffmpeg/BUILD.txt
      to: licenses/whiteboard/FFMPEG-BUILD.txt
  icon: src/renderer/public/icon.png
  publish:
    provider: generic
    url: https://update.dknx.top/linggao-ai/
  target:
    - dmg
    - zip
win:
  publish:
    provider: github
    owner: xubai1177
    repo: post-agents
  icon: src/renderer/public/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
